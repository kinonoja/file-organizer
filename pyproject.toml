[project]
name = "file-organizer"
version = "0.1.0"
description = "A CLI tool to organize messy folders by file type"
requires-python = ">=3.10"
dependencies = ["click>=8.1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov", "ruff", "mypy"]

[project.scripts]
organize = "src.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]